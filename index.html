<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Tasks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>AI Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: focus header (what needs you) → clickable count strip → job health grid (run-history ticks) → activity feed */
  :root {
    --bg: #f3f5f8; --surface: #ffffff; --sunk: #e9edf2; --ink: #131a24; --muted: #5b6676; --faint: #8b95a4; --line: #dbe1e9;
    --accent: #3b4fd8;
    --ok: #1f8a4c; --bad: #c8372d; --wait: #a86300; --run: #2463d6; --stale: #7f8a99;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --surface: #151b24; --sunk: #10151d; --ink: #e6ebf2; --muted: #95a1b2; --faint: #6c7789; --line: #263142;
      --accent: #8b9bff; --ok: #4cc47f; --bad: #f0746c; --wait: #f0b04a; --run: #6ea3ff; --stale: #7d8899; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { max-width: 980px; margin: 0 auto;
    padding: 0 max(16px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; }
  .ghost:hover { border-color: var(--faint); }
  .primary { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 14px; }
  [hidden] { display: none !important; }

  /* sign-in */
  #login { max-width: 380px; margin: 18vh auto 0; text-align: center; }
  #login h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; }
  #login p { color: var(--muted); margin: 0; }
  #login form { display: flex; gap: 8px; margin-top: 18px; }
  #login input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; }
  #msg { color: var(--muted); margin-top: 12px; min-height: 1.4em; }

  /* header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(18px + env(safe-area-inset-top)) 0 6px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; letter-spacing: -.01em; margin: 0; }
  .live { width: 9px; height: 9px; border-radius: 50%; background: var(--stale); position: relative; flex: none; }
  .live.on { background: var(--ok); }
  .live.on::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--ok); opacity: 0; animation: ping 2.4s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(.5); opacity: .7; } 100% { transform: scale(1.4); opacity: 0; } }
  .livetxt { font-size: 12px; color: var(--muted); font-weight: 400; }
  .notice { color: var(--muted); padding: 12px 0; }

  /* focus header */
  .focus { padding: 18px 0 8px; }
  .focus h2 { font-size: clamp(26px, 5vw, 34px); line-height: 1.15; letter-spacing: -.02em; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }
  .focus h2 .n { color: var(--wait); }
  .focus .sub { color: var(--muted); margin: 0 0 16px; }
  .focus .sub:empty { display: none; }
  .asks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 12px; }
  .ask { background: color-mix(in srgb, var(--wait) 7%, var(--surface)); border: 1px solid color-mix(in srgb, var(--wait) 40%, var(--line));
    border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; min-width: 0; }
  .ask .t { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .ask .t strong { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .ask p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta { font-size: 12.5px; color: var(--muted); }
  .ask .go { justify-self: start; border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500; font-size: 14px; }
  .clear { display: flex; gap: 14px; align-items: center; padding: 16px 18px; border-radius: 14px;
    background: color-mix(in srgb, var(--ok) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--ok) 30%, var(--line)); }
  .clear .ic { width: 34px; height: 34px; border-radius: 50%; background: var(--ok); color: var(--surface); display: grid; place-items: center; font-weight: 600; flex: none; }

  /* count strip */
  .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 26px 0 0; border: 1px solid var(--line);
    border-radius: 12px; background: var(--surface); overflow: hidden; }
  .tile { border: 0; border-right: 1px solid var(--line); background: transparent; text-align: left; padding: 12px 14px; display: grid; gap: 2px; }
  .tile:last-child { border-right: 0; }
  .tile:hover { background: var(--sunk); }
  .tile .num { font: 500 26px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
  .tile .lbl { font-size: 12px; color: var(--muted); letter-spacing: .02em; display: flex; align-items: center; gap: 6px; }
  .tile .lbl i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .tile[aria-pressed="true"] { background: var(--sunk); box-shadow: inset 0 -3px 0 var(--accent); }
  .tile.zero .num { color: var(--faint); }

  /* jobs */
  .sechead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 16px; margin: 30px 0 10px; }
  .sechead h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
  .sechead h3 span { font-weight: 400; text-transform: none; letter-spacing: 0; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters select, .filters input { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 13.5px; min-width: 0; }
  .filters input { width: 170px; }
  .filterchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border: 0; border-radius: 99px; padding: 3px 10px; }
  .jobs { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .job { border-bottom: 1px solid var(--line); }
  .job:last-child { border-bottom: 0; }
  .jrow { width: 100%; border: 0; background: transparent; text-align: left; display: grid;
    grid-template-columns: minmax(0, 1fr) auto 58px 76px 16px; gap: 16px; align-items: center; padding: 12px 16px; }
  .jrow:hover { background: color-mix(in srgb, var(--sunk) 60%, transparent); }
  .jname { min-width: 0; }
  .jname strong { font-weight: 500; display: block; overflow-wrap: anywhere; }
  .jname small { color: var(--muted); font-size: 12.5px; }
  .ticks { display: flex; gap: 3px; align-items: center; }
  .tk { width: 9px; height: 20px; border-radius: 2px; background: var(--line); display: inline-block; }
  .tk.done { background: var(--ok); } .tk.failed { background: var(--bad); } .tk.needs_input { background: var(--wait); }
  .tk.running { background: var(--run); animation: breathe 1.6s ease-in-out infinite; }
  .tk.stale { background: repeating-linear-gradient(135deg, var(--stale) 0 3px, transparent 3px 5px); outline: 1px solid var(--stale); outline-offset: -1px; }
  .tk.empty { background: transparent; outline: 1px dashed var(--line); outline-offset: -1px; }
  @keyframes breathe { 50% { opacity: .45; } }
  .rate { font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .rate.warn { color: var(--bad); }
  .last { font: 12.5px var(--mono); color: var(--muted); text-align: right; }
  .chev { color: var(--faint); transition: transform .15s; font-size: 12px; }
  .job.open .chev { transform: rotate(90deg); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 99px; white-space: nowrap; justify-self: start; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.done { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .pill.failed { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
  .pill.needs_input { color: var(--wait); background: color-mix(in srgb, var(--wait) 14%, transparent); }
  .pill.running { color: var(--run); background: color-mix(in srgb, var(--run) 12%, transparent); }
  .pill.stale { color: var(--stale); background: color-mix(in srgb, var(--stale) 14%, transparent); }
  .hist { display: none; padding: 2px 16px 14px; }
  .job.open .hist { display: block; }
  .run { display: grid; grid-template-columns: 112px 104px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 13.5px; align-items: baseline; }
  .run time { font: 12.5px var(--mono); color: var(--muted); }
  .run p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .run p.none { color: var(--faint); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .tk { width: 7px; height: 12px; animation: none; }

  /* feed */
  .feed { display: grid; }
  .ev { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ev time { font: 12.5px var(--mono); color: var(--faint); padding-top: 1px; }
  .ev .h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .ev .h strong { font-weight: 500; }
  .ev p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--muted); padding: 18px 16px; font-size: 14px; }

  @media (max-width: 640px) {
    .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tile:nth-child(2) { border-right: 0; }
    .tile:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    .jrow { grid-template-columns: minmax(0, 1fr) auto 14px; grid-template-areas: "n r c" "t l c"; gap: 6px 12px; }
    .jname { grid-area: n; } .rate { grid-area: r; } .chev { grid-area: c; } .ticks { grid-area: t; } .last { grid-area: l; }
    .tk { width: 8px; height: 16px; }
    .run { grid-template-columns: 1fr auto; } .run p { grid-column: 1 / -1; }
    .filters { width: 100%; } .filters input { width: 100%; } .filters select { flex: 1 1 120px; }
  }
  @media (prefers-reduced-motion: reduce) { .live.on::after, .tk.running { animation: none; } }
</style>
</head>
<body>
<main>
  <section id="login" hidden>
    <h1>AI Tasks</h1>
    <p>Sign in with a one-time email link. Access is by invitation only.</p>
    <form id="loginForm">
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      <button class="primary" type="submit">Send link</button>
    </form>
    <div id="msg"></div>
  </section>

  <section id="app" hidden>
    <header>
      <h1 class="brand"><span class="live" id="live" title="Live connection"></span>AI Tasks <span class="livetxt" id="livetxt">connecting</span></h1>
      <button class="ghost" id="signout">Sign out</button>
    </header>
    <div id="notOwner" class="notice" hidden>You are signed in, but this account has not been given access to the dashboard yet.</div>

    <section class="focus" aria-labelledby="focusTitle">
      <h2 id="focusTitle">Loading…</h2>
      <p class="sub" id="focusSub"></p>
      <div id="asks"></div>
    </section>

    <div class="strip" id="strip" role="group" aria-label="Filter by state"></div>

    <div class="sechead">
      <h3>Jobs <span id="jobCount"></span></h3>
      <div class="filters">
        <span id="chip"></span>
        <input id="fSearch" type="search" placeholder="Find a job" aria-label="Find a job">
        <select id="fSource" aria-label="Source"><option value="">All sources</option></select>
        <select id="fAccount" aria-label="Account"><option value="">All accounts</option></select>
      </div>
    </div>
    <div class="jobs" id="jobs"></div>
    <div class="legend" aria-hidden="true">
      <span><i class="tk done"></i>Done</span><span><i class="tk failed"></i>Failed</span><span><i class="tk needs_input"></i>Needs input</span>
      <span><i class="tk running"></i>Running</span><span><i class="tk stale"></i>No update 60m+</span><span>Oldest → newest, last 14 runs</span>
    </div>

    <div class="sechead"><h3>Latest activity</h3></div>
    <div class="feed" id="feed"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ---- Configuration (filled in at deploy time; the publishable key is safe to ship) ----
const SUPABASE_URL = "https://nicvyxcysbbywxhdosrp.supabase.co";
const SUPABASE_KEY = "sb_publishable_4Dwg-8c0k2HrWC_SoHNUnA_q4Y2flvm";
const STALE_MINUTES = 60;   // a "running" task with no update for this long is shown as possibly stuck
const LOAD_LIMIT = 500;     // enough rows for every job to show its run history
const TICKS = 14;           // runs shown per job in the health grid
const FEED_LIMIT = 10;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const M = 60e3, D = 24 * 60 * M;
let tasks = new Map();
let channel = null;
let stateFilter = "";
const openJobs = new Set();

const LABEL = { running: "Running", needs_input: "Needs input", done: "Done", failed: "Failed", stale: "No update" };
const TILES = [
  { key: "needs_input", label: "Needs you", color: "var(--wait)" },
  { key: "running", label: "Running", color: "var(--run)" },
  { key: "stale", label: "No update 60m+", color: "var(--stale)" },
  { key: "failed", label: "Failed, last 24h", color: "var(--bad)" },
];
const RANK = { needs_input: 0, failed: 1, stale: 2, running: 3, done: 4 };

function ago(iso) {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
function view(t) {
  const stale = t.status === "running" && Date.now() - Date.parse(t.updated_at) > STALE_MINUTES * M;
  return stale ? "stale" : t.status;
}
const when = new Intl.DateTimeFormat(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" });
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const pill = (v) => el("span", "pill " + v, LABEL[v] || v);
const jobName = (t) => t.title || t.source || "Untitled";
const failedRecently = (t) => t.status === "failed" && Date.now() - Date.parse(t.updated_at) < D;

function fillSelect(sel, values, first) {
  const cur = sel.value;
  sel.replaceChildren(new Option(first, ""), ...values.map((v) => new Option(v, v)));
  sel.value = values.includes(cur) ? cur : "";
}

function renderFocus(needs) {
  const asks = $("asks");
  if (!needs.length) {
    $("focusTitle").textContent = "All clear";
    $("focusSub").textContent = "";
    const box = el("div", "clear");
    const text = el("div");
    text.append(el("strong", null, "Nothing is waiting on you."), el("div", "meta", "New asks from your agents will show up here."));
    box.append(el("span", "ic", "✓"), text);
    asks.replaceChildren(box);
    return;
  }
  const title = $("focusTitle");
  title.replaceChildren(el("span", "n", String(needs.length)), needs.length === 1 ? " task needs you" : " tasks need you");
  $("focusSub").textContent = "These runs are paused until you act.";
  const grid = el("div", "asks");
  for (const t of needs) {
    const card = el("article", "ask");
    const top = el("div", "t");
    top.append(el("strong", null, jobName(t)), el("span", "meta", ago(t.updated_at)));
    card.append(top);
    if (t.summary) card.append(el("p", null, t.summary));
    card.append(el("div", "meta", [t.account, t.machine].filter(Boolean).join(" · ")));
    const go = el("button", "go", "See run history →");
    go.addEventListener("click", () => {
      openJobs.add(jobName(t));
      stateFilter = "";
      render();
      document.querySelector(`[data-job="${CSS.escape(jobName(t))}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    card.append(go);
    grid.append(card);
  }
  asks.replaceChildren(grid);
}

function renderStrip(counts) {
  $("strip").replaceChildren(...TILES.map((tile) => {
    const b = el("button", "tile" + (counts[tile.key] ? "" : " zero"));
    b.setAttribute("aria-pressed", String(stateFilter === tile.key));
    const lbl = el("span", "lbl");
    const swatch = el("i");
    swatch.style.background = tile.color;
    lbl.append(swatch, tile.label);
    b.append(el("span", "num", String(counts[tile.key])), lbl);
    b.addEventListener("click", () => { stateFilter = stateFilter === tile.key ? "" : tile.key; render(); });
    return b;
  }));
  const chip = $("chip");
  if (!stateFilter) { chip.replaceChildren(); return; }
  const c = el("button", "filterchip", TILES.find((x) => x.key === stateFilter).label + " ✕");
  c.setAttribute("aria-label", "Clear state filter");
  c.addEventListener("click", () => { stateFilter = ""; render(); });
  chip.replaceChildren(c);
}

function jobRow(j) {
  const isOpen = openJobs.has(j.title);
  const wrap = el("div", "job" + (isOpen ? " open" : ""));
  wrap.dataset.job = j.title;
  const row = el("button", "jrow");
  row.setAttribute("aria-expanded", String(isOpen));

  const name = el("div", "jname");
  const sub = el("small");
  sub.append(pill(j.v), " " + [j.latest.account, j.latest.machine].filter(Boolean).join(" · "));
  name.append(el("strong", null, j.title), sub);

  const ticks = el("div", "ticks");
  const recent = j.runs.slice(0, TICKS).reverse();
  for (let i = recent.length; i < TICKS; i++) ticks.append(el("i", "tk empty"));
  for (const t of recent) {
    const k = el("i", "tk " + view(t));
    k.title = `${when.format(new Date(t.updated_at))} · ${LABEL[view(t)] || t.status}`;
    ticks.append(k);
  }

  const finished = j.runs.filter((t) => t.status === "done" || t.status === "failed");
  const ok = finished.filter((t) => t.status === "done").length;
  const pct = finished.length ? Math.round(ok / finished.length * 100) : null;
  const rate = el("span", "rate" + (pct != null && pct < 80 ? " warn" : ""), pct == null ? "–" : pct + "%");
  rate.title = `${ok} of ${finished.length} finished runs succeeded`;

  row.append(name, ticks, rate, el("span", "last", ago(j.latest.updated_at)), el("span", "chev", "▶"));
  row.addEventListener("click", () => { isOpen ? openJobs.delete(j.title) : openJobs.add(j.title); render(); });

  const hist = el("div", "hist");
  for (const t of j.runs.slice(0, 6)) {
    const r = el("div", "run");
    r.append(el("time", null, when.format(new Date(t.updated_at))), pill(view(t)),
      el("p", t.summary ? null : "none", t.summary || "No summary yet."));
    hist.append(r);
  }
  wrap.append(row, hist);
  return wrap;
}

function render() {
  const all = [...tasks.values()].sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at));
  fillSelect($("fSource"), [...new Set(all.map((t) => t.source).filter(Boolean))].sort(), "All sources");
  fillSelect($("fAccount"), [...new Set(all.map((t) => t.account).filter(Boolean))].sort(), "All accounts");
  const src = $("fSource").value, acc = $("fAccount").value, q = $("fSearch").value.trim().toLowerCase();
  const shown = all.filter((t) => (!src || t.source === src) && (!acc || t.account === acc));

  const needs = shown.filter((t) => t.status === "needs_input");
  renderFocus(needs);
  renderStrip({
    needs_input: needs.length,
    running: shown.filter((t) => view(t) === "running").length,
    stale: shown.filter((t) => view(t) === "stale").length,
    failed: shown.filter(failedRecently).length,
  });

  // One row per job. The dashboard-report skill keeps a job's title the same on every run.
  const byJob = new Map();
  for (const t of shown) {
    const k = jobName(t);
    if (!byJob.has(k)) byJob.set(k, []);
    byJob.get(k).push(t);
  }
  const jobs = [...byJob].map(([title, runs]) => ({ title, runs, latest: runs[0], v: view(runs[0]) }));
  let list = jobs.filter((j) => !q || j.title.toLowerCase().includes(q));
  if (stateFilter === "failed") list = list.filter((j) => j.runs.some(failedRecently));
  else if (stateFilter === "needs_input") list = list.filter((j) => j.runs.some((t) => t.status === "needs_input"));
  else if (stateFilter) list = list.filter((j) => j.runs.some((t) => view(t) === stateFilter));
  list.sort((a, b) => (RANK[a.v] ?? 5) - (RANK[b.v] ?? 5) || Date.parse(b.latest.updated_at) - Date.parse(a.latest.updated_at));

  $("jobCount").textContent = `· ${list.length} of ${jobs.length}`;
  $("jobs").replaceChildren(...(list.length ? list.map(jobRow)
    : [el("div", "empty", jobs.length ? "No jobs match these filters." : "No runs reported yet.")]));

  const feed = shown.filter((t) => !q || jobName(t).toLowerCase().includes(q)).slice(0, FEED_LIMIT);
  $("feed").replaceChildren(...(feed.length ? feed.map((t) => {
    const e = el("div", "ev");
    const body = el("div");
    const h = el("div", "h");
    h.append(el("strong", null, jobName(t)), pill(view(t)));
    body.append(h);
    if (t.summary) body.append(el("p", null, t.summary));
    e.append(el("time", null, ago(t.updated_at).replace(" ago", "")), body);
    return e;
  }) : [el("div", "empty", "No activity yet.")]));

  document.title = needs.length ? `(${needs.length}) AI Tasks` : "AI Tasks";
}

async function load() {
  const { data, error } = await sb.from("ai_tasks").select("*").order("updated_at", { ascending: false }).limit(LOAD_LIMIT);
  if (error) { console.error(error); return; }
  tasks = new Map(data.map((t) => [t.id, t]));
  render();
}

function setLive(on) {
  $("live").classList.toggle("on", on);
  $("livetxt").textContent = on ? "live" : "offline";
}

function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("tasks-feed")
    .on("postgres_changes", { event: "*", schema: "public", table: "ai_tasks" }, (p) => {
      if (p.eventType === "DELETE") tasks.delete(p.old.id); else tasks.set(p.new.id, p.new);
      render();
    })
    .subscribe((status) => setLive(status === "SUBSCRIBED"));
}

async function start(session) {
  $("login").hidden = !!session;
  $("app").hidden = !session;
  if (!session) { if (channel) { sb.removeChannel(channel); channel = null; } return; }
  const { data: owner } = await sb.from("ai_dashboard_owners").select("user_id").maybeSingle();
  $("notOwner").hidden = !!owner;
  await load();
  subscribe();
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("msg").textContent = "Sending…";
  const { error } = await sb.auth.signInWithOtp({
    email: $("email").value.trim(),
    // Never create accounts from this page; users are provisioned in Supabase.
    options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: false },
  });
  $("msg").textContent = error
    ? (/signups? not allowed|not found/i.test(error.message) ? "This email has not been given access." : error.message)
    : "If this email has access, a sign-in link is on its way.";
});
$("signout").addEventListener("click", () => sb.auth.signOut());
$("fSource").addEventListener("change", render);
$("fAccount").addEventListener("change", render);
$("fSearch").addEventListener("input", render);

let signedIn = null;
sb.auth.onAuthStateChange((_event, session) => {
  const now = !!session;
  if (now === signedIn) return;      // ignore token refreshes
  signedIn = now;
  setTimeout(() => start(session), 0); // avoid calling Supabase inside the auth callback
});

// Refresh relative times and stale flags; reload when the tab comes back to the foreground.
setInterval(() => { if (signedIn) render(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && signedIn) load(); });
</script>
</body>
